<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <title>How Will I Die?</title>
    <meta name="description" content="The leading eventual causes of death for people who share your country, age, and sex, projected from WHO mortality data. Population statistics, not a personal prediction.">
    <meta name="theme-color" content="#0b7285">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <main>
        <h1>How Will I Die?</h1>
        <p class="reframe">
            These are the most common eventual causes of death for people of your
            country, age, and sex. They are population statistics, not a prediction
            about you.
        </p>

        <form id="query" hidden>
            <label for="country">Country</label>
            <select id="country" name="country" required></select>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="0" max="110" step="1" inputmode="numeric" required>

            <label for="sex">Sex <span class="note">as recorded in the data</span></label>
            <select id="sex" name="sex" required>
                <option value="" disabled selected>Select</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
            </select>

            <button type="submit">Show causes</button>
        </form>

        <section id="result" aria-live="polite"></section>
        <p id="status" role="status">Loading data...</p>
    </main>

    <footer>
        <p><a href="about.html">How this is calculated, sources, and limitations</a></p>
        <p class="attribution"></p>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
