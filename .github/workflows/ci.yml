name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Determinism gate: rebuild the lookup from the committed intermediate and
      # confirm it matches the committed web/data, so the shards cannot drift.
      - run: uv run python -m hwid_pipeline.check_lookup

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/app.js
      # Added in phase 3: build (esbuild minify + content hashing) and run the
      # Playwright end-to-end suite against the built site.
